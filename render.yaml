# Render.com Infrastructure as Code
# https://render.com/docs/blueprint-spec

databases:
  - name: seimas-db
    plan: free
    databaseName: seimas
    user: seimas

services:
  - type: web
    name: seimas-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn backend.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: DB_DSN
        fromDatabase:
          name: seimas-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11"
    autoDeploy: true
    repo: https://github.com/prekyba3000-bit/Seimas.v2
    healthCheckPath: /health
